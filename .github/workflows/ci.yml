name: Agent Recruiter Expert Pipeline (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  expert-qa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install expert toolchain
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pytest pytest-asyncio
        pip install -e .[all]

    - name: Expert Linting (Ruff Standard)
      run: ruff check src/

    - name: Deep Type Verification (MyPy)
      run: mypy src/ --ignore-missing-imports

    - name: Performance & Logic Validation (Pytest)
      run: pytest tests/ -v
